[project]
name = "job-search-buddy-pro"
version = "0.1.0"
description = "Scrape SWE/SRE/AI and data science / data engineering jobs from public ATS boards, rank them against the Resume Tailoring Assistant knowledge base, tailor, and assist applying."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
]

[project.scripts]
jsb = "jsb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jsb"]
