# job-search-buddy-pro search configuration.
# Candidate facts (name, contact, skills, experience) are NOT stored here. They are read from
# your base resume, so there is one source of truth.

# Your base resume: PDF, DOCX, Markdown or plain text, in resume/ (git-ignored). If `base` is
# left empty, the one file in resume/ is used. `jsb resume` shows what was read from it.
resume:
  base:                   # e.g. resume/base_resume.pdf
  max_pages: 1            # tailored resumes are fitted to this many pages
  model: sonnet           # Claude model used to parse and tailor
  cover_letter: false     # also write a cover letter on every `jsb tailor` (or pass --cover-letter)

# Context for Claude's match scoring. Location defaults to the one on your resume.
candidate:
  location: Sunnyvale, CA
  relocation: Open to remote (US), Bay Area onsite/hybrid, or relocating anywhere in the US,
    so a US location is never a gap or dealbreaker.

# Only keep postings first seen / published within this many days.
max_age_days: 21

# How many times Claude scores each job in `rerank`; the scores are averaged (single runs vary ~±7).
rerank_runs: 2

# Minimum rule-based score (0-100) to show in `jsb list` / the report.
min_score: 55

# --- Role tracks -----------------------------------------------------------------
# Each track is a kind of role you're searching for. A title is routed to the first active
# track whose title_include matches and whose title_exclude (plus the global one below)
# doesn't. The track decides role families, Workday search terms, Claude's re-rank rubric,
# and (optionally) apply-criteria overrides. Order matters: earlier tracks win ties.
active_tracks: [swe, ds]

tracks:
  swe:
    label: Software / SRE / AI engineering
    target: Senior Software Engineer       # what Claude's re-rank judges you against
    title_include:
      - '\bsoftware (development )?engineer'
      - '\bsde\b'
      - '\bswe\b'
      - '\bbackend\b'
      - '\bback[- ]end\b'
      - '\bplatform engineer'
      - '\binfrastructure engineer'
      - '\bsite reliability'
      - '\bsre\b'
      - '\breliability engineer'
      - '\bproduction engineer'
      - '\bdistributed systems'
      - '\b(ai|ml|llm|genai|machine learning|applied ai) (platform |infrastructure |systems )?engineer'
      - '\bmlops\b'
      - '\bmember of technical staff'
      - '\bforward deployed engineer'
      - '\bagent(s|ic)? (infrastructure|platform|engineer)'
      - '\bdevops engineer'
      - '\bcloud engineer'
    title_exclude:
      - '\bscientist\b'                  # research / data / applied scientist titles belong to ds
      # data-engineering titles belong to ds ("Software Engineer, Data Platform" stays here)
      - '\bdata (platform|infrastructure|pipelines?|reliability|integration|warehouse|lakehouse) engineer'
    seniority_stretch: ['\bstaff\b', '\blead\b', '\btechnical leader\b', '\barchitect\b']
    workday_queries: ['software engineer', 'site reliability engineer', 'machine learning engineer']

  ds:
    label: Data science, analytics & data engineering
    target: Senior Data Scientist
    # Claude's re-rank and the RTA judge you against this instead, for jobs in these role types.
    family_targets:
      DS · Data engineering: Senior Data Engineer
      DS · Analytics engineering: Senior Analytics Engineer
    title_include:
      - '\bdata scien(ce|tist)'
      - '\b(applied|machine learning|ml|ai|decision|product|research data) scientist'
      - '\bscientist,? (machine learning|ml|ai|data|analytics|applied)'
      - '\b(product|growth|marketing|business|data|quantitative|decision) analytics\b'
      - '\b(product|growth|quantitative|senior data|staff data|lead data) analyst'
      - '\banalytics engineer'
      - '\bdata engineer(ing)?\b'
      - '\b(big data|etl|elt|dataops|data pipelines?|data warehouse|lakehouse|streaming data) (engineer|developer)'
      - '\bdata (platform|infrastructure|reliability|integration|warehouse|lakehouse|ops) engineer'
      - '\bdataops\b'
      - '\bexperimentation\b'
      - '\bcausal inference'
      - '\b(statistician|econometrician)'
      - '\bml (modeling|ranking|personalization)'
      - '\b(ranking|recommendations?|personalization|search relevance) (scientist|engineer)'
    title_exclude:
      - '\bresearch scientist'            # mostly PhD / publication-driven; add back if that's you
      - '\b(bio|clinical|chemi|soil|food)\w*\b|\blab\b'   # wet-lab and field sciences
      - '\bdata entry'
      - '\b(bi|business intelligence|reporting) (analyst|developer)'
      - '\bactuar'
      - '\bsolutions? (specialist|architect|consultant)|\bconsultant\b'   # pre-sales / services
    seniority_stretch: ['\bstaff\b', '\blead\b', '\barchitect\b']
    workday_queries: ['data scientist', 'applied scientist', 'machine learning scientist', 'analytics engineer',
                      'data engineer']
    # Optional per-track overrides of apply_criteria below (any key). A SWE-heavy profile
    # scores lower on DS rubrics, so these bars are a bit lower; delete to use the global values.
    # (A pay floor set here, e.g. min_base_pay: 180000, beats the global one but not --min-pay.)
    apply_criteria:
      min_match: 72
      stretch_match: 62

# Applies to every track.
title_exclude:
  - '\bmanager\b'
  - '\bdirector\b'
  - '\bhead of\b'
  - '\bvp\b'
  - '\bintern(ship)?\b'
  - '\bnew grad'
  - '\b(university|college) grad'
  - '\bgraduate\b'
  - '\bamts\b'
  - '\bjunior\b'
  - '\bentry[- ]level\b'
  - '\bassociate\b'
  - '\bprincipal\b'
  - '\bdistinguished\b'
  - '\bfellow\b'
  - '\b(ios|android|mobile)\b'
  - '\bfront[- ]?end\b'
  - '\bdesign systems?\b'
  - '\bfirmware\b'
  - '\bembedded\b'
  - '\bhardware\b'
  - '\bfpga\b'
  - '\basic\b'
  - '\bsilicon\b'
  - '\bverification\b'
  - '\bsales\b'
  - '\bsolutions? engineer'
  - '\bsupport engineer'
  - '\brecruit'
  - '\bqa\b'
  - '\btest engineer'
  - '\bsecurity engineer'
  - '\b(japan|korea|germany|london|dublin|india|canada|emea|apac)\b'

# --- Location ---------------------------------------------------------------------
# Open to relocating anywhere in the US (confirmed 2026-09-28), so other US cities score
# almost the same as the Bay Area. Non-US roles are filtered out entirely.
location_weights:
  bay_area: 1.0         # home base, no move
  remote_us: 1.0
  us: 0.95              # anywhere else in the US (relocation)
  remote_unclear: 0.8   # "Remote" with no country stated
  unknown: 0.6          # location couldn't be parsed

