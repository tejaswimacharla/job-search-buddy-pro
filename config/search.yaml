# Workday: tenant, wd host number, site name (from the careers URL
# https://<tenant>.<wdN>.myworkdayjobs.com/<site>). Searched server-side with the queries below.
workday:
  - {tenant: nvidia, host: wd5, site: NVIDIAExternalCareerSite, company: NVIDIA}
  - {tenant: salesforce, host: wd12, site: External_Career_Site, company: Salesforce}
  - {tenant: adobe, host: wd5, site: external_experienced, company: Adobe}
  - {tenant: intel, host: wd1, site: External, company: Intel}
  - {tenant: cisco, host: wd5, site: Cisco_Careers, company: Cisco}
  - {tenant: paypal, host: wd1, site: jobs, company: PayPal}
  - {tenant: workday, host: wd5, site: Workday, company: Workday}
  - {tenant: capitalone, host: wd12, site: Capital_One, company: Capital One}
  - {tenant: autodesk, host: wd1, site: Ext, company: Autodesk}
workday_queries: ['software engineer', 'site reliability engineer', 'machine learning engineer']

# SmartRecruiters company identifiers.
smartrecruiters: [ServiceNow, LinkedIn3]

# --- Apply criteria ---------------------------------------------------------------
# Hard gates for tailoring and applying. Jobs outside these still get scraped and scored
# (they appear in the dashboard with the "all jobs" toggle) but `tailor`, `apply` and
# `rerank` skip them unless you pass --force.
apply_criteria:
  max_posted_hours: 72          # posted within the last 72 hours
  min_base_pay: 200000          # USD/year (top of the posted range must be above this)
  pay_basis: top                # top: range must reach above min_base_pay; bottom: whole range above it
  include_unlisted_pay: false   # postings with no pay range can't be verified, so they're excluded
  years_min: 2                  # the posting's required years must fall within 2..7
  years_max: 7
  include_unlisted_years: true  # many senior postings don't state years; keep them
  exclude_citizenship_required: true  # US citizenship / clearance / ITAR roles (needs visa support)
  exclude_no_sponsorship: true        # postings saying they won't / may not sponsor H-1B or other visas
  exclude_recent_layoffs_months: 6    # companies with layoffs in this window (PERM-friendliness); 0 = off
  min_match: 75                 # "apply" tier: match % (Claude's score once re-ranked, else the rule score)
  stretch_match: 65             # "stretch" tier: 65-74% also qualifies, listed separately

  # Companies that cap how often you can apply. above_match is strict (">"), and the cap counts
  # submissions tracked here plus any dates you list under already_applied.
  company_limits:
    - company: OpenAI
      max_applications: 6
      window_days: 180
      above_match: 85
      already_applied: []       # e.g. [2026-07-14, 2026-08-02]
    - company: Anthropic
      max_applications: 6
      window_days: 180
      above_match: 85
      already_applied: []

# Where layoff data comes from: official California WARN notices (refreshed on every scrape),
# plus Claude web research for companies with qualifying jobs. Your own entries and
# exceptions go in config/layoffs.yaml.
layoffs:
  research_ttl_days: 7      # re-check a company's news after this many days
  research_model: sonnet
  research_per_run: 25      # max companies researched per `jsb daily`
