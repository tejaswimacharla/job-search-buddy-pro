# job-search-buddy search configuration.
# Candidate facts (name, contact, skills, experience) are NOT stored here. They are
# read live from the Resume Tailoring Assistant (RTA) knowledge base so there is one
# source of truth.

rta_path: ../resume-tailoring-assistant

# Only keep postings first seen / published within this many days.
max_age_days: 21

# How many times Claude scores each job in `rerank`; the scores are averaged (single runs vary ~±7).
rerank_runs: 2

# Minimum rule-based score (0-100) to show in `jsb list` / the report.
min_score: 55

# --- Role filters ---------------------------------------------------------------
# A title must match at least one include pattern and no exclude pattern.
# Patterns are case-insensitive regexes.
title_include:
  - '\bsoftware (development )?engineer'
  - '\bsde\b'
  - '\bswe\b'
  - '\bbackend\b'
  - '\bback[- ]end\b'
  - '\bplatform engineer'
  - '\binfrastructure engineer'
  - '\bsite reliability'
  - '\bsre\b'
  - '\breliability engineer'
  - '\bproduction engineer'
  - '\bdistributed systems'
  - '\b(ai|ml|llm|genai|machine learning|applied ai) (platform |infrastructure |systems )?engineer'
  - '\bmlops\b'
  - '\bmember of technical staff'
  - '\bforward deployed engineer'
  - '\bagent(s|ic)? (infrastructure|platform|engineer)'
  - '\bdevops engineer'
  - '\bcloud engineer'

title_exclude:
  - '\bmanager\b'
  - '\bdirector\b'
  - '\bhead of\b'
  - '\bvp\b'
  - '\bintern(ship)?\b'
  - '\bnew grad'
  - '\b(university|college) grad'
  - '\bgraduate\b'
  - '\bamts\b'
  - '\bjunior\b'
  - '\bentry[- ]level\b'
  - '\bassociate\b'
  - '\bprincipal\b'
  - '\bdistinguished\b'
  - '\bfellow\b'
  - '\b(ios|android|mobile)\b'
  - '\bfront[- ]?end\b'
  - '\bdesign systems?\b'
  - '\bfirmware\b'
  - '\bembedded\b'
  - '\bhardware\b'
  - '\bfpga\b'
  - '\basic\b'
  - '\bsilicon\b'
  - '\bverification\b'
  - '\bsales\b'
  - '\bsolutions? engineer'
  - '\bsupport engineer'
  - '\brecruit'
  - '\bresearch scientist'
  - '\bdata scientist'
  - '\bqa\b'
  - '\btest engineer'
  - '\bsecurity engineer'
  - '\b(japan|korea|germany|london|dublin|india|canada|emea|apac)\b'

# Seniority fit: titles containing these get a small penalty (candidate targets Senior).
seniority_stretch: ['\bstaff\b', '\blead\b', '\btechnical leader\b', '\barchitect\b']

# --- Location ---------------------------------------------------------------------
# Open to relocating anywhere in the US (confirmed 2026-09-28), so other US cities score
# almost the same as the Bay Area. Non-US roles are filtered out entirely.
location_weights:
  bay_area: 1.0         # home base, no move
  remote_us: 1.0
  us: 0.95              # anywhere else in the US (relocation)
  remote_unclear: 0.8   # "Remote" with no country stated
  unknown: 0.6          # location couldn't be parsed

# Postings must mention one of these (or be remote in the US) to be kept.
preferred_locations: ['sunnyvale', 'san jose', 'santa clara', 'mountain view', 'palo alto',
                      'cupertino', 'menlo park', 'redwood city', 'san mateo', 'san francisco',
                      'bay area', 'south bay', 'foster city', 'sf office', 'burlingame',
                      'fremont', 'milpitas', 'oakland', 'emeryville', 'berkeley', 'los gatos',
                      'campbell', 'los altos', 'brisbane', 'south san francisco']
us_markers: ['united states', 'usa', 'u.s.', ', ca', 'california', 'new york', ', ny', 'seattle',
             ', wa', 'austin', ', tx', 'texas', 'boston', ', ma', 'chicago', 'denver', 'atlanta',
             'los angeles', 'remote - us', 'remote (us', 'us remote', 'us-remote', 'remote, us',
             'north america', 'bellevue', 'portland', 'washington', 'new jersey', 'virginia']
non_us_markers: ['london', 'dublin', 'toronto', 'vancouver', 'montreal', 'canada', 'india',
                 'bangalore', 'bengaluru', 'hyderabad', 'berlin', 'munich', 'germany', 'paris',
                 'amsterdam', 'singapore', 'tokyo', 'japan', 'sydney', 'australia', 'tel aviv',
                 'israel', 'zurich', 'warsaw', 'poland', 'mexico', 'brazil', 'são paulo',
                 'seoul', 'korea', 'uk', 'united kingdom', 'ireland', 'spain', 'madrid',
                 'barcelona', 'lisbon', 'stockholm', 'copenhagen', 'emea', 'apac', 'latam']

